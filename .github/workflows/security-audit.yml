name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly, Monday 6am UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install root dependencies
        run: npm install

      - name: Audit root dependencies (high/critical only)
        run: npm audit --audit-level=high

      - name: Install functions dependencies
        working-directory: ./functions
        run: npm install

      - name: Audit functions dependencies (high/critical only)
        working-directory: ./functions
        run: npm audit --audit-level=high
